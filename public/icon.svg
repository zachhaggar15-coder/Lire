<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sorlio">
  <!--
    Sunrise over an open book.

    "Sorlio" carries both halves of what the app is: sol/soleil and lire. The
    mark says the same thing in one image — a sun clearing the horizon, where
    the horizon is a book seen face-on: two covers standing slightly open,
    each one a touch taller at the spine than at its outer edge, which is
    what reads as "open book" rather than "two rectangles" even at launcher
    size.

    Two rules hold the geometry together down to 48px:

      1. The sun and the pages never touch. A clear band of green between
         them keeps both shapes reading as separate objects at any size.
      2. The spine is a gap, not a stroke. Each cover stops a few px short of
         center so the background shows through as a notch — that notch is
         what makes it read as two covers rather than one shape.

    No letterform anywhere, deliberately: a wordmark inside an app icon is
    unreadable at launcher size, and a mark without one survives a rename.
  -->
  <rect width="512" height="512" rx="112" fill="#16593C"/>
  <circle cx="256" cy="176" r="66" fill="#F9D96B"/>
  <path d="M152 280h98v176l-114-16v-144q0-16 16-16z" fill="#FFFCF4"/>
  <path d="M360 280h-98v176l114-16v-144q0-16-16-16z" fill="#E4EFE7"/>
</svg>
