<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Same mark as icon.svg, scaled into Android's adaptive-icon safe zone
       (66% of the canvas) since the OS applies its own mask shape and clips
       anything outside that zone on some launchers. -->
